esphome:
  name: sensor-telemetry
  friendly_name: Sensor Telemetry

esp32:
  board: esp32-s3-devkitc-1

logger:

wifi:
  ssid: wifi
  password: wifi_password

external_components:
  - source:
      type: local
      path: ../esphome/components/

mqtt:
  broker: 192.168.1.10
  topic_prefix: digitaltwin/telemetry

ros2_mqtt:
  default_qos: 0

time:
  - platform: sntp
    id: sntp_time

# Swap these templates for real drivers (ultrasonic_sensor in m,
# adc in V). Publications are skipped until the sensor has state.
sensor:
  - platform: template
    id: sonar_distance
    name: Sonar Distance
    unit_of_measurement: m
  - platform: template
    id: pack_voltage
    name: Pack Voltage
    unit_of_measurement: V

ros2:
  middleware: mqtt
  time: sntp_time
  publications:
    - topic: /sonar/range
      type: sensor_msgs/Range
      source:
        sensor:
          id: sonar_distance
      frame_id: sonar
      qos: best_effort
      radiation_type: ultrasound
      field_of_view: 0.5
      min_range: 0.02
      max_range: 4.0
      interval: 1s
    - topic: /battery/state
      type: sensor_msgs/BatteryState
      source:
        sensor:
          id: pack_voltage
      frame_id: base_link
      min_voltage: 3.0
      max_voltage: 4.2
      design_capacity: 2.5
      technology: lipo
      location: main_pack
      interval: 10s
